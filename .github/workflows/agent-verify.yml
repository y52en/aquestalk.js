name: Agent verification

on:
  push:
    branches:
      - agent/optimize-performance-memory

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: f1 10000-call deterministic soak
        run: npm run benchmark:soak
      - name: all voices 2000-call deterministic soak
        run: BENCH_LONG_VOICES=dvd,f1,f2,imd1,jgr,m1,m2,r1 BENCH_SOAK_ITERATIONS=2000 node --expose-gc benchmark/long-input.mjs
