name: Apply stop trampoline halt patch

on:
  push:
    branches: [agent/optimize-performance-memory]
    paths: [.github/workflows/patch-stop-hlt.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-performance-memory
      - name: Add HLT after stop OUT
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/v86_emu.ts')
          s = p.read_text()
          old = 'const STOP_TRAMPOLINE = new Uint8Array([0xe6, STOP_PORT]);'
          new = '''// `_stopped` is observed by JS only after the current v86 JIT block returns.\n// HLT immediately after OUT prevents a warmed block from running on into the NOP sled.\nconst STOP_TRAMPOLINE = new Uint8Array([0xe6, STOP_PORT, 0xf4]);'''
          if old not in s:
              raise SystemExit('expected STOP_TRAMPOLINE definition not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/v86_emu.ts
          git commit -m 'fix: halt immediately after the v86 return trap'
          git push origin HEAD:agent/optimize-performance-memory
